# Production stack. Copied to /opt/domainvitals by the deploy script.
# IMAGE_PREFIX and IMAGE_TAG are exported by infrastructure/scripts/deploy.sh.
name: domainvitals

x-app: &app
  image: ${IMAGE_PREFIX:?}-backend:${IMAGE_TAG:?}
  env_file: .env
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  backend:
    <<: *app

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    healthcheck: { disable: true }

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck: { disable: true }

  web:
    image: ${IMAGE_PREFIX:?}-web:${IMAGE_TAG:?}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: ["./certs:/etc/nginx/certs:ro"]
    depends_on:
      backend: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  redisdata:
