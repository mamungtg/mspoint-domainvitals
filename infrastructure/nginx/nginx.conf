# DomainVitals edge. TLS: Cloudflare (Full strict) -> this Nginx with a
# Cloudflare Origin Certificate mounted at /etc/nginx/certs.

include /etc/nginx/snippets/cloudflare-realip.conf;

server_tokens off;
client_max_body_size 2m;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

# HTTP -> HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Reject requests for unknown host names.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    return 444;
}

# Customer dashboard (SPA) + same-origin API.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.mspointit.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    root /usr/share/nginx/html;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}

# Public API host (for future API keys / integrations).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.mspointit.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }
    location / {
        return 404;
    }
}
