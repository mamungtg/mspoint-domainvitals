# A variable makes nginx resolve "backend" through Docker DNS at request time,
# so a recreated backend container (new IP) never leaves nginx pointing at the old one.
set $dv_backend http://backend:8000;
proxy_pass $dv_backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
