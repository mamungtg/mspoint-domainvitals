[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101", "S105", "S106", "E501"]  # line length is handled by ruff format

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"config/settings/*" = ["F405", "F403"]
